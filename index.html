<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock-Paper-Scissor Game</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=light_mode,dark_mode" />
  </head>
  <body class="light">
    <header>
      <div class="header">
        <h1>Rock-Paper-Scissor</h1>
        <span class="material-symbols-outlined">light_mode</span>
      </div>
    </header>

    <main>
      <div class="choices">
        <div class="choice" id="rock"><img src="./images/rock.png" alt="rock"></div>
        <div class="choice" id="paper"><img src="./images/paper.png" alt="paper"></div>
        <div class="choice" id="scissor"><img src="./images/scissor.png" alt="scissor"></div>
      </div>

      <div class="score-card">
        <div class="score">
            <p id="user-score">0</p>
            <p>You</p>
        </div>
        <div class="score">
            <p id="computer-score">0</p>
            <p>Computer</p>
        </div>
      </div>

      <div class="msg-container"><p id="msg">Play your move</p></div>

    </main>
    
    <script src="script.js"></script>
  </body>
</html>
